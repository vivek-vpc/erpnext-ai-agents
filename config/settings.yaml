# Local demo configuration: built-in mock ERP, so you can try the UI with no ERPNext.
# The default token below is for local use only: it is accepted only on this machine and is refused through a tunnel or proxy
# (auth.access_keys defaults to "local" in the demo too; "anywhere" has to be written down on purpose and is warned about at start-up).
# Set ERP_AGENTS_OWNER_TOKEN (24+ characters) to use your own, and keep the server on 127.0.0.1.
database:
  path: ./data/erp_agents.db

erp:
  type: mock

policy:
  min_days_cover: 7
  use_lead_time_rule: true
  safety_stock_days: 3
  default_lead_time_days: 7
  predictive_enabled: true
  lookahead_days: 14
  target_cover_days: 30

channels:
  console:
    enabled: true
  inbox:
    enabled: true

approvals:
  strategy: all
  recipients:
    - id: owner
      name: Owner
      roles: [admin, approver]
      channels:
        - { type: console }
        - { type: inbox }

auth:
  # This file is a demo on the built-in mock ERP, so it may fall back to the well-known key below. The program starts with a well-known key ONLY when this flag
  # is written down, and the flag is refused with a real ERPNext (erp.type: erpnext). Remove the flag as soon as you set ERP_AGENTS_OWNER_TOKEN.
  allow_demo_key: true
  tokens:
    - { token: "${ERP_AGENTS_OWNER_TOKEN:-demo-owner-token}", user: owner, roles: [admin, approver] }

server:
  host: 127.0.0.1
  port: 8100
