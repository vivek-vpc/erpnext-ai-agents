# Golden cases: who may ask for what. A viewer can read; only a person who may approve can ask for a request to be prepared; nobody and nothing writes to ERPNext from a question,
# and the AI agent can prepare a request only when the person asked for it in so many words, for the item and quantity they named. (Every case also checks, by default, that
# no document was written to the ERP and no approval request was created: a case that expects one says `prepared: 1`.)
cases:
  - id: permissions-viewer-cannot-ask-for-an-order
    group: permissions
    note: A viewer is told no, and no request is created.
    world: quiet
    as: viewer
    question: Create a purchase order for BOLT-M8 for 500
    expect:
      intent: order_request
      must_include: ["Only people who can approve orders can ask me to prepare one"]
      prepared: 0

  - id: permissions-viewer-cannot-cancel-an-order
    group: permissions
    note: Cancelling is refused for a viewer before anything is looked up.
    as: viewer
    question: cancel PO PUR-ORD-2026-00012
    expect:
      intent: order_manage
      must_include: ["Only people who can approve orders can cancel one"]

  - id: permissions-viewer-cannot-move-stock
    group: permissions
    note: A stock transfer request is refused for a viewer.
    world: quiet
    as: viewer
    question: Move 50 BOLT-M8 from Stores to Finished Goods
    expect:
      intent: stock_transfer
      must_include: ["Only people who can approve can ask me to prepare a stock transfer"]

  - id: permissions-viewer-can-still-read-stock
    group: permissions
    note: Being a viewer does not take away the answers to questions.
    as: viewer
    question: How much BOLT-M8 do we have?
    expect:
      intent: item_stock
      must_include: ["300 pcs"]

  - id: permissions-approver-can-ask-for-an-order-request
    group: permissions
    note: An approver gets a request prepared for them to answer. Nothing is ordered, and no document reaches the ERP.
    world: quiet
    question: Create a purchase order for BOLT-M8 for 500
    expect:
      intent: order_request
      must_include: ["I prepared a purchase order request for 500 pcs", "Nothing is ordered until you press Create order"]
      prepared: 1

  - id: permissions-agent-no-order-for-a-viewer
    group: permissions
    note: The AI agent is not even offered the tool that prepares an order when a viewer asks; if the model calls it, the call is refused.
    entry: agent
    as: viewer
    world: quiet
    question: Create a purchase order for BOLT-M8 for 500
    reply: bad
    llm:
      - tools: [[prepare_order_request, {item_code: BOLT-M8, qty: 500, reason: the manager asked}]]
      - say: I have what I need.
      - answer: {answerable: false, answer: ""}
    expect:
      status: not_enough_information
      outcome: declined
      no_tools: [prepare_order_request]
      prepared: 0

  - id: permissions-agent-no-order-for-a-plain-question
    group: permissions
    note: Even for an approver, a question that is not a request for an order does not get the tool that prepares one.
    entry: agent
    world: quiet
    question: How much BOLT-M8 do we have and what do vendors charge?
    reply: bad
    llm:
      - tools: [[prepare_order_request, {item_code: BOLT-M8, qty: 500, reason: to be safe}]]
      - say: I have what I need.
      - answer: {answerable: false, answer: ""}
    expect:
      status: not_enough_information
      outcome: declined
      no_tools: [prepare_order_request]
      prepared: 0

  - id: permissions-agent-keeps-to-the-quantity-asked
    group: permissions
    note: The person asked for 500; a model that tries 777 is refused, and nothing is prepared.
    entry: agent
    world: quiet
    question: Create a purchase order for BOLT-M8 for 500
    reply: bad
    llm:
      - tools: [[prepare_order_request, {item_code: BOLT-M8, qty: 777, reason: more is safer}]]
      - say: I have what I need.
      - answer: {answerable: false, answer: ""}
    expect:
      status: not_enough_information
      outcome: declined
      no_tools: [prepare_order_request]
      prepared: 0

  - id: permissions-agent-keeps-to-the-item-asked
    group: permissions
    note: The person named BOLT-M8; a model that picks another item is refused.
    entry: agent
    world: quiet
    question: Create a purchase order for BOLT-M8 for 500
    reply: bad
    llm:
      - tools: [[prepare_order_request, {item_code: STEEL-2MM, qty: 500, reason: cheaper}]]
      - say: I have what I need.
      - answer: {answerable: false, answer: ""}
    expect:
      status: not_enough_information
      outcome: declined
      no_tools: [prepare_order_request]
      prepared: 0
