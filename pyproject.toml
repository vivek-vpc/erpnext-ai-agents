[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext-ai-agents"
version = "0.1.0"
description = "Stock assistant for small-business ERP (ERPNext first): watches stock, compares vendors, and asks a person to approve before it creates a draft purchase order"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["erpnext", "frappe", "inventory", "procurement", "reorder", "whatsapp", "telegram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "certifi>=2026.10.19",                      # floor: earlier versions have a known vulnerability (PYSEC-2026-4320, found by pip-audit 25 Oct 2026)
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "apscheduler>=3.10,<4",
    "tzdata; platform_system == 'Windows'",   # zoneinfo needs this on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "bandit>=1.8", "pip-audit>=2.7"]
agents = ["mcp>=2.3,<3", "jsonschema>=4.20"]       # the AI agents and the MCP server (MIT-licensed SDK); everything else works without it
otel = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]       # optional tracing (observability.tracing: true); docs/OBSERVABILITY.md

[project.urls]
Homepage = "https://github.com/vivek-vpc/erpnext-ai-agents"
Repository = "https://github.com/vivek-vpc/erpnext-ai-agents"
Issues = "https://github.com/vivek-vpc/erpnext-ai-agents/issues"
Security = "https://github.com/vivek-vpc/erpnext-ai-agents/security/advisories/new"

[project.scripts]
erp-agents = "erp_agents.core.cli:main"
erpnext-ai-agents = "erp_agents.core.cli:main"            # the same command under the repository's name

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erp_agents = ["settings.example.yaml", "packs/stock_procurement/web/*", "packs/*/manifest.yaml", "packs/*/README.md"]

[tool.pytest.ini_options]
# core and cross-cutting tests live in tests/; each pack keeps its own next to its code. conftest.py (the shared fixtures) is at the repository root, and every test folder is on the
# path so a test can borrow a helper from a test in another folder.
testpaths = ["tests", "src/erp_agents/packs"]
pythonpath = ["src", ".", "tests", "src/erp_agents/packs/stock_procurement/tests"]
