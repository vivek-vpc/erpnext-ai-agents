name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agents,otel]"
      # The console is also tested in a DOM (Node and jsdom, pinned by tests/browser/package-lock.json): one cell of the matrix has them, and there the test is required, not skipped.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          node-version: "24"
      - name: Install the console DOM test tools (exact versions from the lockfile) and check them for known vulnerabilities
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          npm ci --prefix tests/browser
          npm audit --prefix tests/browser
      - name: Test
        run: python -m pytest -q
        env:
          ERP_AGENTS_REQUIRE_BROWSER_TESTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && '1' || '' }}

  ai-evals:
    name: AI evaluation (no model, no ERPNext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agents]"
      - name: Golden cases and the limits in tests/evals/thresholds.json (the table appears on the pull request)
        run: python -m tools.evals --check --markdown "$GITHUB_STEP_SUMMARY"

  semgrep:
    name: Semgrep with Frappe's rules (not a required check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Semgrep (the version these rules were run with locally)
        run: python -m pip install --upgrade pip "semgrep==1.182.1"
      # Frappe's rules (MIT licence) for apps on the Marketplace: https://docs.frappe.io/cloud/marketplace/app-authoring-guidelines . Fetched at the commit that was read and run (30 Sep 2026).
      - name: Fetch Frappe's rules at a fixed commit
        run: |
          git clone https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          git -C frappe-semgrep-rules checkout 81a6e3d47a328249e8ddf04c586e493dd5553002
      - name: Frappe's rules, errors fail the job (none today)
        run: semgrep --config frappe-semgrep-rules/rules --severity ERROR --error --metrics=off --exclude "**/tests/**" src
      - name: Frappe's rules, warnings (28 today, all explained in docs/SECURITY_CHECKS.md)
        continue-on-error: true
        run: semgrep --config frappe-semgrep-rules/rules --severity WARNING --metrics=off --exclude "**/tests/**" src
      - name: Semgrep's Python correctness rules, as the Frappe guide asks (advisory, because the registry changes without a change here)
        continue-on-error: true
        run: semgrep --config r/python.lang.correctness --metrics=off --exclude "**/tests/**" src

  security-scans:
    name: bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agents,otel]"
      - name: bandit (any finding fails the build; a justified exception carries a nosec comment that says why)
        run: python -m bandit -r src -q -x "src/erp_agents/packs/*/tests/*"
      - name: pip-audit (known vulnerabilities in the dependencies)
        run: python -m pip_audit --skip-editable

  secrets-and-personal-data:
    name: No secrets or personal data in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -u
          # git grep exits 0 = something found, 1 = nothing found, anything else = the scan itself failed (a bad pattern must not pass as "clean")
          scan() { rc=0; git grep -nIE "$@" || rc=$?; if [ "$rc" -gt 1 ]; then echo "the scan itself failed (git grep exit $rc)"; exit 2; fi; return "$rc"; }
          if scan '(EAA[A-Za-z0-9]{40,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!docs/*.md' ; then
            echo "A token or key looks committed. Rotate it and remove it from history."; exit 1
          fi
          if scan '(gmail\.com|outlook\.com|yahoo\.com|192\.168\.[0-9]+\.[0-9]+|C:\\Users\\)' -- . ':!LICENSE' ':!src/erp_agents/packs/stock_procurement/tests/test_assistant.py' ':!tests/test_hardening.py' ':!src/erp_agents/packs/stock_procurement/tests/test_agents.py' ; then
            echo "Personal data or a machine address looks committed. Use placeholders."; exit 1
          fi

  docker-demo:
    name: Docker demo starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t erpnext-ai-agents:demo .
      - name: Start and check the console answers
        run: |
          docker run -d --name demo -p 127.0.0.1:8100:8100 erpnext-ai-agents:demo
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8100/ui/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "console status: $code"
          [ "$code" = "200" ] || { docker logs demo; exit 1; }
          token=$(docker logs demo 2>&1 | grep -A1 "enter this access key" | tail -1 | tr -d ' ')
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:8100/api/v1/approvals | grep -q '"status":"pending"'
