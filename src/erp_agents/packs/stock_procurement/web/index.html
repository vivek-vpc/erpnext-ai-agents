<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Assistant</title>
<style>
:root{--bg:#F6F4EE;--card:#fff;--line:#E3DFD3;--line2:#EFECE3;--ink:#1B2420;--muted:#56625B;--green:#0E6B58;--green-d:#0A5546;--green-soft:#E1F0EA;--red:#B3361B;--red-soft:#FCE8E2;--amber:#7A4E00;--amber-soft:#FBEFCF;--blue-soft:#E4EEF9;--grey-soft:#ECE9E0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--green-d)}a:hover{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FB8A8;outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 272px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.main{flex:999 1 560px;min-width:0;max-width:1280px;padding:32px 40px 64px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{display:block;font-size:18px;line-height:1.2}.brand small{color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:0;background:transparent;color:var(--ink);text-align:left;font-weight:700;cursor:pointer;width:100%}
.nav button small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.3}
.nav button:hover{background:#F3F1EA}
.nav button.on{background:var(--green-soft);color:var(--green-d)}.nav button.on small{color:var(--green-d)}
.nav .count{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:13px;font-weight:800;min-width:26px;text-align:center;padding:1px 8px}
.side-foot{margin-top:auto;border-top:1px solid var(--line2);padding:16px 8px 0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.side-foot .row{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#1E8E5A;flex:none}.dot.bad{background:var(--red)}.dot.grey{background:#9AA29D}
.me{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--bg);color:var(--ink)}
.me b{display:block}
.subnav{display:flex;flex-direction:column;gap:4px}
.subnav button{display:block;text-align:left;width:100%;padding:12px 14px;border-radius:12px;color:var(--ink);font-weight:700;border:1.5px solid transparent;background:transparent;cursor:pointer}
.subnav button small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.3}
.subnav button:hover{background:#F3F1EA}
.subnav button.on{background:#fff;border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
@media(max-width:820px){
  .side{flex:1 1 100%;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nav button{flex:none;width:auto}.nav button small{display:none}
  .side-foot .row,.side-foot>div:not(.me){display:none}
  .main{padding:20px 16px 48px}.h1{font-size:26px!important}
  .subnav{flex-direction:row;overflow-x:auto}.subnav button{flex:none;width:auto}.subnav button small{display:none}
}
@media(max-width:520px){
  .req{padding:18px}.req .btns .btn{flex:1 1 100%}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact b{font-size:20px}
  .card-h,.card-b{padding-inline:18px}.savebar .btns{width:100%}.savebar .btns .btn{flex:1}
}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
.h1{font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:17px;margin-top:6px;max-width:680px}
.h2{font-size:20px;font-weight:800;line-height:1.3}.h3{font-size:17px;font-weight:800;line-height:1.3}
.muted{color:var(--muted)}.small{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.card-h{padding:20px 24px;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.card-b{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.empty{padding:28px 24px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #CFC9B8;background:#fff;font-weight:700;color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}.tab span{font-weight:600;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.urgent{background:var(--red-soft);color:#8E2A12}.pill.soon{background:var(--amber-soft);color:var(--amber)}.pill.ok{background:var(--green-soft);color:var(--green-d)}
.pill.off{background:var(--grey-soft);color:var(--muted)}.pill.info{background:var(--blue-soft);color:#174C86}
.btn{min-height:44px;padding:0 20px;border-radius:12px;border:1.5px solid #CFC9B8;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:#F8F6F0}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-d)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--green-d)}.btn.danger{color:var(--red)}.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}.btns{display:flex;flex-wrap:wrap;gap:10px}
.req{padding:24px;display:flex;flex-direction:column;gap:16px}.req+.req{border-top:1px solid var(--line2)}
.req-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.said{font-size:18px;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fact{background:var(--bg);border-radius:14px;padding:12px 16px}.fact b{display:block;font-size:24px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}.fact span{font-size:14px;color:var(--muted)}
.why{background:#FAF9F5;border:1px solid var(--line2);border-radius:14px;padding:14px 18px}.why>b{display:block;margin-bottom:4px}
.why ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ask{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ask-row{display:flex;flex-wrap:wrap;gap:8px}.ask-row .in{flex:1 1 280px}
.answer{background:var(--blue-soft);border-radius:14px;padding:12px 16px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:14px;color:var(--muted);font-weight:700;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:top}.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}.tbl small{display:block;color:var(--muted);font-size:13px;line-height:1.35}.tbl tr.best td{background:#F2F8F5}.tbl details.wh{margin-top:2px}.tbl details.wh summary{cursor:pointer;color:var(--green-d);font-size:13px;font-weight:700;line-height:1.35}.tbl .whrow{display:flex;justify-content:space-between;gap:14px;font-size:13px;line-height:1.5;text-align:left}.tbl a.mv{font-weight:700;white-space:nowrap;margin-left:6px}
.mvback{position:fixed;inset:0;background:rgba(27,36,32,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.mvbox{background:#fff;border-radius:20px;padding:24px;width:min(520px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px rgba(27,36,32,.25)}
.in{min-height:44px;padding:0 12px;border:1.5px solid #BDB7A4;border-radius:10px;background:#fff;font:inherit}
.in.short{width:96px}.in.changed{border-color:var(--green);background:var(--green-soft)}
textarea.in{padding:10px 12px;min-height:84px;width:100%}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:17px;line-height:1.7}
.rule-note{color:var(--muted);font-size:14px;margin:-6px 0 0}
.field{display:flex;flex-direction:column;gap:6px}.field>label,.label{font-weight:700}.field small{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.check{display:flex;gap:12px;align-items:flex-start}.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
.check b{display:block}.check small{display:block;color:var(--muted);font-size:14px}
.segb{display:inline-flex;border:1.5px solid #BDB7A4;border-radius:10px;overflow:hidden;flex:none}
.segb button{border:0;background:#fff;padding:0 14px;min-height:40px;font-weight:700;font-size:14px;cursor:pointer}
.segb button+button{border-left:1.5px solid #BDB7A4}.segb button.on{background:var(--green);color:#fff}
.stockrow{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
.stockrow .nm{flex:1 1 260px}.stockrow .nm small{display:block;color:var(--muted);font-size:14px}
.formula{background:var(--bg);border-radius:14px;padding:14px 18px;line-height:1.7}
.savebar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 20px;position:sticky;bottom:12px}
.callout{background:var(--green-soft);border-radius:14px;padding:14px 18px;color:#0B4638}
.callout.warn{background:var(--amber-soft);color:#5C3A00}.callout.bad{background:var(--red-soft);color:#7A2410}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--grey-soft)}
.range{width:100%;accent-color:var(--green)}
.tl-item{display:flex;gap:16px;padding:18px 24px;border-top:1px solid var(--line2)}.tl-item:first-child{border-top:0}
.tl-dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none;background:var(--green)}
.tl-dot.warn{background:#C98A00}.tl-dot.bad{background:var(--red)}.tl-dot.off{background:#9AA29D}.tl-when{color:var(--muted);font-size:14px}
.sub-step{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
fieldset.lock{border:0;padding:0;margin:0;min-width:0}
pre.reason{white-space:pre-wrap;margin:10px 0 0;font:inherit;background:#FAF9F5;border:1px solid var(--line2);border-radius:14px;padding:12px 16px}
.msgs{display:flex;flex-direction:column;gap:18px}
.msg{max-width:min(900px,100%);display:flex;flex-direction:column;gap:10px}.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:12px 16px;border-radius:18px;line-height:1.6;white-space:pre-line}
.msg.me .bubble{background:var(--green);color:#fff;border-bottom-right-radius:6px}
.msg.bot .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.bot .bubble.err{background:var(--red-soft);border-color:#E9B8AA;color:#7A2410}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kvgrid .kv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}.kv span{font-size:13px;color:var(--muted);display:block}.kv b{font-size:18px;line-height:1.3}
.chipbtn{border:1.5px solid #CFC9B8;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:15px}.chipbtn:hover{background:#F8F6F0}
.askbar{position:sticky;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:0 6px 24px rgba(27,36,32,.08)}
.askbar .in{flex:1 1 280px}
.typing{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;max-width:90vw;z-index:30}
.toast.err{background:var(--red)}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.loginbox{width:min(440px,100%);display:flex;flex-direction:column;gap:20px}
.logincard{padding:28px;display:flex;flex-direction:column;gap:18px}
</style>
</head>
<body>

<div id="login" class="loginwrap" hidden></div>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
      <div><b>Stock Assistant</b><small>for your ERPNext</small></div>
    </div>
    <nav class="nav" aria-label="Main menu" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span class="dot grey" id="erpDot"></span><span id="erpText">Checking ERPNext…</span></div>
      <div class="row"><span class="dot grey" id="waDot"></span><span id="waText">&nbsp;</span></div>
      <div class="me"><b id="meName">&nbsp;</b><span class="small muted" id="meLevel"></span><br><a href="#" id="signout" style="display:inline-block;margin-top:6px;font-weight:700">Sign out</a></div>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const state = { view: "ok", cfg: "reorder", okTab: "all", stockTab: "all", find: "", histTab: "all", me: null, mode: { erpnext: false, access_key: true },
  items: [], global: null, system: null, schema: null, pending: [], proc: null, opts: null, asst: null, cal: null, basis: null, chat: [] };
try { state.chat = JSON.parse(sessionStorage.getItem("chat") || "[]"); } catch (e) { state.chat = []; }

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(n, d = 1) { return n == null ? "–" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d }); }
function money(n) { return n == null ? "–" : "₹" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 5000); }
const when = iso => iso ? String(iso).slice(0, 16).replace("T", " ") : "";
const can = cap => !!(state.me && (state.me.caps || []).includes(cap));

// ---------------------------------------------------------------- talking to the server
class ApiError extends Error { constructor(status, detail) { super(typeof detail === "string" ? detail : (detail && detail.message) || "Request failed (" + status + ")"); this.status = status; this.code = detail && detail.code; } }
async function api(method, path, body) {
  const tok = sessionStorage.getItem("tok");
  const res = await fetch(path, { method, headers: { ...(tok ? { "Authorization": "Bearer " + tok } : {}), ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && tok && !path.startsWith("/api/v1/auth/")) { endSession("Your session ended. Please sign in again."); throw new ApiError(401, "Sign in required"); }
  if (!res.ok) throw new ApiError(res.status, data.detail);
  return data;
}
function endSession(note) { sessionStorage.removeItem("tok"); sessionStorage.removeItem("chat"); state.chat = []; state.me = null; showLogin("form", { note }); }

// ---------------------------------------------------------------- sign in (through ERPNext)
function showLogin(view, info = {}) {
  $("#app").hidden = true;
  const el = $("#login"); el.hidden = false;
  const brand = `<div class="brand" style="padding:0"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div><div><b>Stock Assistant</b><small>for your ERPNext</small></div></div>`;
  let card = "";
  if (view === "form" && state.mode.erpnext) {
    card = `<div><h1 class="h1" style="font-size:26px">Sign in</h1><p class="lead" style="font-size:16px">Use the same username and password as ERPNext.</p></div>
      ${info.note ? `<div class="callout warn" role="alert">${esc(info.note)}</div>` : ""}
      ${info.error ? `<div class="callout bad" role="alert">${info.error}</div>` : ""}
      <form id="lf" style="display:flex;flex-direction:column;gap:18px">
        <div class="field"><label for="lu">Username or email</label><input id="lu" class="in" value="${esc(info.user || "")}" autocomplete="username" required></div>
        <div class="field"><label for="lp">Password</label><div style="display:flex;gap:8px"><input id="lp" class="in" type="password" style="flex:1;min-width:0" autocomplete="current-password" required><button type="button" class="btn" id="lshow">Show</button></div>
          <small>Your password goes straight to ERPNext. The Stock Assistant never stores it.</small></div>
        <button class="btn primary" type="submit" id="lgo">Sign in</button>
      </form>
      ${state.mode.access_key ? `<p class="small muted">Administrator, on the server: <a href="#" id="tokey">use the access key</a></p>` : ""}
      <p class="small muted" style="border-top:1px solid var(--line2);padding-top:14px">Forgot your password? Reset it in ERPNext.</p>`;
  } else if (view === "form" || view === "key") {
    card = `<div><h1 class="h1" style="font-size:26px">Enter your access key</h1><p class="lead" style="font-size:16px">${state.mode.erpnext ? "This is the emergency way in, from your Stock Assistant setup file." : "Enter the access key from your Stock Assistant setup file."}</p></div>
      ${info.error ? `<div class="callout bad" role="alert">${info.error}</div>` : ""}
      <form id="kf" style="display:flex;flex-direction:column;gap:18px"><div class="field"><label for="kk">Access key</label><input id="kk" class="in" type="password" autocomplete="off" required><small>It is only remembered until you close this browser tab.</small></div>
      <button class="btn primary" type="submit">Open the Stock Assistant</button></form>
      ${state.mode.erpnext ? `<p class="small"><a href="#" id="tologin">Sign in with ERPNext instead</a></p>` : ""}`;
  } else if (view === "code") {
    card = `<div><h1 class="h1" style="font-size:26px">Enter your verification code</h1><p class="lead" style="font-size:16px">${esc(info.prompt || "ERPNext asks for a second step on your account. Type the 6-digit code from your authenticator app.")}</p></div>
      ${info.error ? `<div class="callout bad" role="alert">${info.error}</div>` : ""}
      <form id="cf" style="display:flex;flex-direction:column;gap:18px"><div class="field"><label for="cc">6-digit code</label><input id="cc" class="in num" inputmode="numeric" maxlength="12" autocomplete="one-time-code" style="letter-spacing:.3em;font-size:22px;text-align:center" required><small>The code changes every 30 seconds.</small></div>
      <button class="btn primary" type="submit">Verify and sign in</button></form><p class="small"><a href="#" id="tologin">Use a different account</a></p>`;
  } else if (view === "noaccess") {
    card = `<div><span class="pill soon">Signed in to ERPNext</span><h1 class="h1" style="font-size:26px;margin-top:12px">You do not have access here yet</h1>
      <p class="lead" style="font-size:16px">${esc(info.message || "Your ERPNext account does not have a role that can use the Stock Assistant.")}</p></div>
      <div class="why"><b>What to do</b><p>Ask your ERPNext administrator to give you a role that can read Items (to look at stock), and one that can create Purchase Orders (to approve orders). For example Stock User or Purchase User, and Purchase Manager.</p></div>
      <div class="btns"><button class="btn primary" id="tologin">Sign in as someone else</button></div>`;
  } else if (view === "down") {
    card = `<div><h1 class="h1" style="font-size:26px">Cannot reach ERPNext</h1><p class="lead" style="font-size:16px">The Stock Assistant checks your login with ERPNext, so nobody can sign in until ERPNext is back.</p></div>
      <div class="why"><b>Things to check</b><ul><li>ERPNext is running. If you use Docker, all the ERPNext containers should be up.</li><li>The ERPNext address in the Stock Assistant setup is right.</li><li>This computer can open ERPNext in a browser.</li></ul></div>
      <div class="btns"><button class="btn primary" id="tologin">Try again</button></div>`;
  }
  el.innerHTML = `<div class="loginbox">${brand}<div class="card logincard">${card}</div></div>`;
  $("#lshow") && $("#lshow").addEventListener("click", () => { const p = $("#lp"); p.type = p.type === "password" ? "text" : "password"; $("#lshow").textContent = p.type === "password" ? "Show" : "Hide"; });
  $("#tokey") && $("#tokey").addEventListener("click", e => { e.preventDefault(); showLogin("key"); });

function wireAsk(root) {

// ================================================================ Your stock
function statusOf(i) {
  if (i.status === "DISABLED") return ["off", "Not watched", "Monitoring is turned off for this item."];
  if (i.status === "ERROR") return ["urgent", "Problem", i.error || "The assistant could not work this item out."];
  if (i.status === "OK") return ["ok", "Fine", ""];
  if (i.status === "EARLY_WARNING") return ["soon", "Keep an eye on it", i.headline];
  if (i.position != null && i.position <= 0) return ["urgent", "Out of stock", i.headline];
  return i.severity === "CRITICAL" ? ["urgent", "Order now", i.headline] : ["soon", "Order soon", i.headline];
}

// The four "what matters" sliders are shares of 100: whole numbers that add up to exactly `total`, keeping the proportions of `values` (largest-remainder rounding).
function toShares(values, total = 100) {
  const sum = values.reduce((a, b) => a + b, 0);
  const exact = sum > 0 ? values.map(v => v * total / sum) : values.map(() => total / values.length);
  const out = exact.map(Math.floor);
  let left = total - out.reduce((a, b) => a + b, 0);
  exact.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { out[i]++; left--; } });
  return out;
}
// Moving one slider takes from, or gives to, the others in proportion to where they were when the drag began, so they always add up to 100 and the handles show what the
// percentages say. Dragging back restores the earlier proportions exactly.
function linkSliders(el, keys) {
  const get = k => $("#p_" + k, el);
  let base = keys.map(k => Number(get(k).value));
  keys.forEach((k, idx) => {
    get(k).addEventListener("input", () => {
      const v = Math.min(100, Math.max(0, Math.round(Number(get(k).value))));
      const others = keys.map((_, i) => i).filter(i => i !== idx);
      const split = toShares(others.map(i => base[i]), 100 - v);
      others.forEach((i, n) => { get(keys[i]).value = split[n]; });
      get(k).value = v;
    });
    get(k).addEventListener("change", () => { base = keys.map(kk => Number(get(kk).value)); });
  });
}

function parseCron(c) {

}

async function waitForTask(id, onTick) {
  for (let i = 0; i < 600; i++) {

    <section class="card"><div class="card-h"><div><h2 class="h2">Tokens used</h2><p class="muted small">What the agents have used, so there are no surprises on the provider's bill.</p></div></div><div class="card-b" id="usagebox">${usageHtml(usage, curP.hosted)}</div></section>
    <section class="card"><div class="card-h"><div><h2 class="h2">Today's brief</h2><p class="muted small">${brief.stored ? "The latest one" + (brief.started_at ? " (" + esc(when(brief.started_at)) + ")" : "") : "Not written by an agent yet. This is the plain version."}</p></div>
      <div class="btns">${ok ? `<button class="btn" id="briefnow">${v.enabled ? "Write a new brief now" : "Refresh"}</button>` : ""}</div></div><div class="card-b" style="gap:12px"><div id="briefbox">${agentBriefHtml(brief)}</div>
      <p class="muted small" id="briefsrc"><span class="pill ${brief.source === "model" ? "ok" : "off"}">${brief.source === "model" ? "Written by the AI, checked" : "Written by rules"}</span> ${brief.note ? esc(brief.note) : ""}</p></div></section>
    <section class="card"><div class="card-h"><div><h2 class="h2">When should they speak up?</h2><p class="muted small">All optional.</p></div></div><div class="card-b" style="gap:18px">
      <label class="check"><input type="checkbox" id="g_brief" ${v.daily_brief_cron ? "checked" : ""}><span><b>Write the brief every morning at</b> <input type="time" id="g_time" class="in" style="width:auto;display:inline-block;min-height:40px" value="${time}" ${custom ? "disabled" : ""}><small>${custom ? "A custom schedule is set: " + esc(v.daily_brief_cron) + ". Untick to turn it off." : "On this computer's time zone setting. The agent can take a few minutes."}</small></span></label>
      <label class="check"><input type="checkbox" data-gb="send_brief" ${v.send_brief ? "checked" : ""}><span><b>Send the brief to the people who approve orders</b><small>On Telegram and WhatsApp. WhatsApp only delivers a plain message while its 24-hour window is open.</small></span></label>
      <label class="check"><input type="checkbox" data-gb="second_opinion" ${v.second_opinion ? "checked" : ""}><span><b>Add a second opinion to every new order request</b><small>The purchasing agent checks the vendor, timing and quantity, and sends a short note to the same people. It never changes the request.</small></span></label></div></section>
    <section class="card"><div class="card-h"><div><h2 class="h2">What is sent to the AI model</h2><p class="muted small">So you can decide with open eyes.</p></div></div><div class="card-b" style="gap:16px">${where}${list("Sent", pv.sent_to_the_model)}${list("Never sent", pv.never_sent_to_the_model)}${list("Kept on this computer (" + pv.trace_kept_days + " days for the exact messages)", pv.kept_on_this_server)}</div></section>
    <section class="card"><div class="card-b"><details><summary style="cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center">Technical settings</summary><div class="grid2" style="margin-top:12px">
      <div class="field"><label for="g_url">Address of the model service</label><input id="g_url" class="in" data-gt="base_url" value="${esc(v.base_url || "")}" placeholder="the provider's own address"><small>Leave empty for the provider's own. Fill it in for an Ollama on another computer, or a service that speaks the OpenAI protocol.</small></div>
      <div class="field"><label for="g_to">Wait up to (seconds) for one reply</label><input id="g_to" class="in num" data-gn="timeout_seconds" type="number" min="30" value="${v.timeout_seconds}"></div>
      <div class="field"><label for="g_steps">Most model replies per task</label><input id="g_steps" class="in num" data-gn="max_steps" type="number" min="1" max="12" value="${v.max_steps}"><small>Every reply costs time, and tokens on a hosted model.</small></div>
      <div class="field"><label for="g_out">Longest reply (tokens)</label><input id="g_out" class="in num" data-gn="max_output_tokens" type="number" min="64" max="4000" value="${v.max_output_tokens}"><small>Stops a model that never finishes its answer.</small></div>
      <div class="field"><label for="g_tools">Most lookups per task</label><input id="g_tools" class="in num" data-gn="max_tool_calls" type="number" min="1" max="30" value="${v.max_tool_calls}"></div>
      <div class="field"><label for="g_keep">Forget what was sent after (days)</label><input id="g_keep" class="in num" data-gn="keep_traces_days" type="number" min="1" max="365" value="${v.keep_traces_days}"></div>
      <div class="field"><label for="g_mcp">Use another tool server (optional)</label><input id="g_mcp" class="in" data-gt="tools_url" value="${esc(v.tools_url || "")}" placeholder="http://127.0.0.1:8100/mcp"><small>Empty = the built-in tools. Its key is read from ERP_AGENTS_MCP_TOKEN.</small></div></div>
      <label class="check" style="margin-top:16px"><input type="checkbox" id="g_remote" ${!curP.hosted && v.allow_remote ? "checked" : ""}><span><b>Let an Ollama on another computer be used</b><small>Only for the "This computer" choice. Leave it off to keep your data on this computer. For a hosted provider you confirm in its own box above.</small></span></label></details></div></section>${saveBar("gsave")}`;
  const chosen = () => $("input[name=prov]:checked", el).value, provOf = id => provs.find(p => p.id === id) || { hosted: false, label: id };
  $$("input", el).forEach(x => { x.addEventListener("input", () => dirty("gsave", "They apply straight away.")); x.addEventListener("change", () => dirty("gsave", "They apply straight away.")); });
  $$("input[name=prov]", el).forEach(r => r.addEventListener("change", () => {
    const id = chosen(), p = provOf(id);
    $$("[data-pp]", el).forEach(d => { d.style.display = d.dataset.pp === id ? "flex" : "none"; });
    $("#costcard", el).style.display = p.hosted ? "block" : "none";
    $("#g_url").value = id === cur ? (v.base_url || "") : "";                    // a custom address belongs to the provider it was set for
  }));
  $$("[data-check]", el).forEach(b => b.addEventListener("click", async () => {
    const id = b.dataset.check, out = $(`[data-checkout="${id}"]`, el), model = $("#g_model_" + id).value.trim();
    b.disabled = true; out.innerHTML = `<p class="muted small">Checking…</p>`;
    try {
      const r = await api("POST", "/api/v1/agents/check", { provider: id, base_url: id === chosen() ? $("#g_url").value.trim() : "", model });
      const chips = (r.models || []).slice(0, 14).map(x => `<button type="button" class="chipbtn" data-pick="${esc(x)}">${esc(x)}</button>`).join("");
      out.innerHTML = (!r.reachable ? `<div class="callout bad"><b>Not connected.</b> ${esc(r.error || "")}</div>`
        : !r.model_installed ? `<div class="callout warn"><b>Connected, but the model "${esc(r.model)}" is not available to this key.</b> Pick one of these:</div>`
        : `<div class="callout"><b>Connected.</b> The model "${esc(r.model)}" is available.${chips ? " Others you can use:" : ""}</div>`) + (chips && r.reachable ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${chips}</div>` : "");
      $$("[data-pick]", out).forEach(c => c.addEventListener("click", () => { $("#g_model_" + id).value = c.dataset.pick; dirty("gsave", "They apply straight away."); }));
    } catch (e) { out.innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; }
    b.disabled = false;
  }));
  $("#gsave").addEventListener("click", async () => {
    const id = chosen(), p = provOf(id), set = { provider: id };
    $$("[data-gb]", el).forEach(x => set[x.dataset.gb] = x.checked); $$("[data-gt]", el).forEach(x => set[x.dataset.gt] = x.value.trim()); $$("[data-gn]", el).forEach(x => set[x.dataset.gn] = Number(x.value));
    $$("[data-gf]", el).forEach(x => set[x.dataset.gf] = Number(x.value) || 0);
    set.model = $("#g_model_" + id).value.trim();
    if (p.hosted && !$("#g_consent_" + id).checked) { toast(`Tick the box to confirm that what the agents read is sent to ${p.label}.`, true); return; }
    set.allow_remote = p.hosted ? true : $("#g_remote").checked;
    if (!custom || !$("#g_brief").checked) { const [hh, mm] = ($("#g_time").value || "09:00").split(":").map(Number); set.daily_brief_cron = $("#g_brief").checked ? `${mm} ${hh} * * *` : ""; }
    try { await api("PUT", "/api/v1/settings/module/agents", { set }); toast("Settings saved"); cfgAgents(el); } catch (e) { toast(e.message, true); }
  });
  const now = $("#briefnow", el);
  if (now) now.addEventListener("click", async () => {
    now.disabled = true; const label = now.textContent;
    try {
      const r = await api("POST", "/api/v1/agents/brief");
      let b = r, tokens = r.tokens, model = r.model;
      if (r.status === "running") { const t = await waitForTask(r.task_id, secs => { now.textContent = `Working… ${secs}s`; }); b = { ...(t.result || {}), source: (t.result || {}).source, note: t.note || "" }; tokens = (t.result || {}).tokens; model = t.model; }
      $("#briefbox", el).innerHTML = agentBriefHtml(b);
      $("#briefsrc", el).innerHTML = `<span class="pill ${b.source === "model" ? "ok" : "off"}">${b.source === "model" ? "Written by the AI, checked" : "Written by rules"}</span> ${esc(b.note || "")}${tokenLine(tokens, model) ? `<br>${esc(tokenLine(tokens, model))}` : ""}`;
      api("GET", "/api/v1/agents/usage").then(u => { $("#usagebox", el).innerHTML = usageHtml(u, curP.hosted); }).catch(() => { /* the figures refresh next time */ });
    } catch (e) { toast(e.message, true); }
    now.disabled = false; now.textContent = label;
  });
}

// ---- Who can do what: ERPNext decides
function cfgAccess(el) {
  const me = state.me || {}, lv = { settings: "Change settings", decide: "Decide", look: "Look", none: "No access" }[me.level] || me.level;
  el.innerHTML = `<section class="card"><div class="card-h"><div><h2 class="h2">People sign in with their ERPNext account</h2><p class="muted small">You do not create or manage users in the Stock Assistant. It uses the people and permissions you already have in ERPNext.</p></div></div><div class="card-b"><div class="sub-step">
      <div><span class="pill info">Step 1</span><p class="h3" style="margin-top:8px">They sign in</p><p class="muted">With the username and password they use for ERPNext. The password goes straight to ERPNext and is never stored here.</p></div>
      <div><span class="pill info">Step 2</span><p class="h3" style="margin-top:8px">ERPNext says who they are</p><p class="muted">The Stock Assistant asks ERPNext, as that person, for their name, roles and permissions. It trusts nothing else.</p></div>
      <div><span class="pill info">Step 3</span><p class="h3" style="margin-top:8px">ERPNext's permissions decide</p><p class="muted">What someone may do here follows what ERPNext lets them do. Nothing is set up twice.</p></div>
      <div><span class="pill info">Step 4</span><p class="h3" style="margin-top:8px">ERPNext stays in charge</p><p class="muted">Disable a user or remove a role in ERPNext, and it applies here within ${15} minutes.</p></div></div></div></section>
    <section class="card"><div class="card-h"><div><h2 class="h2">Who can do what</h2><p class="muted small">These rules are fixed. Change a person's access by changing their roles in ERPNext.</p></div></div><div class="card-b" style="gap:0">
      <div class="stockrow" style="align-items:flex-start"><div class="nm"><b style="font-size:18px">Look</b><small>See your stock, orders in progress and the history.</small></div><div style="flex:1 1 320px"><span class="pill info">Anyone who can read Items or Purchase Orders in ERPNext</span></div></div>
      <div class="stockrow" style="align-items:flex-start"><div class="nm"><b style="font-size:18px">Decide</b><small>Approve or reject reorders and purchase orders, here, on WhatsApp and on Telegram.</small></div><div style="flex:1 1 320px"><span class="pill info">Anyone who can create Purchase Orders in ERPNext</span><p class="muted small" style="margin-top:6px">This is checked so nobody can create, through the Stock Assistant, an order ERPNext would not let them create themselves.</p></div></div>
      <div class="stockrow" style="align-items:flex-start"><div class="nm"><b style="font-size:18px">Change settings</b><small>Change the rules, vendor choices and reminders.</small></div><div style="flex:1 1 320px"><span class="pill info">Anyone with the System Manager role in ERPNext</span></div></div></div></section>
    <section class="card"><div class="card-h"><h2 class="h2">You</h2></div><div class="card-b" style="gap:10px"><p><b>${esc(me.full_name || me.user || "")}</b> <span class="muted">${esc(me.user || "")}</span></p>
      <p>Your level here: <span class="pill ok">${esc(lv)}</span></p>${(me.roles || []).length ? `<p class="muted">Your ERPNext roles: ${esc(me.roles.join(", "))}</p>` : ""}
      ${me.access_key ? `<div class="callout warn">You are signed in with an access key from the setup file, not with an ERPNext account.</div>` : ""}</div></section>
    <section class="card"><div class="card-h"><div><h2 class="h2">Who ERPNext shows as the creator</h2><p class="muted small">So you can always see in ERPNext who created an order or requisition.</p></div></div><div class="card-b" style="gap:12px">
      <p><b>Approved in this console:</b> the order or requisition is created with the approver's own ERPNext login. ERPNext shows them as the creator, checks their permissions, and keeps its own history.</p>
      <p><b>Approved on WhatsApp or Telegram:</b> ERPNext cannot be signed in as that person from a phone message, so the service account creates it, and the approver's name is written in its "Approved by (Stock Assistant)" field. Turn on "Only create orders and requisitions under the approver's own ERPNext name" under Choosing vendors if you would rather those wait for the console.</p></div></section>
    <section class="card"><div class="card-h"><h2 class="h2">WhatsApp and Telegram approvals</h2></div><div class="card-b" style="gap:12px"><p>Requests are sent to the people, phone numbers and Telegram chat ids listed in the Stock Assistant setup file. A reply from anybody else is ignored, and nothing changes. The first person to answer settles the request.</p>
      <p class="muted">A new colleague who writes /start to the Telegram bot gets their own chat id back, to pass on to whoever runs the setup. Telegram needs no message templates and has no 24-hour limit, so alerts always arrive.</p>
      <p class="muted">Sending them to everyone who can Decide, using the mobile number in their ERPNext profile, is a planned improvement.</p></div></section>`;
}

start();
</script>
</body>
</html>
